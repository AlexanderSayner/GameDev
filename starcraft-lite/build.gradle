plugins {
    id 'java'
    id 'application'
}

group = 'com.rts.game'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.lwjgl:lwjgl:3.3.3'
    implementation 'org.lwjgl:lwjgl-glfw:3.3.3'
    implementation 'org.lwjgl:lwjgl-opengl:3.3.3'
    
    runtimeOnly 'org.lwjgl:lwjgl:3.3.3:natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl-glfw:3.3.3:natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl-opengl:3.3.3:natives-linux'
}

application {
    mainClass = 'com.rts.game.core.Game'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.rts.game.core.Game'
    }
    
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
